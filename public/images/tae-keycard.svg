<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">tAE KeyCard Template</title>
  <desc id="desc">tAE KeyCard branded template with centered QR area sized for production placement.</desc>

  <rect x="0" y="0" width="200" height="200" fill="#101010"/>

  <rect x="4" y="4" width="192" height="192" rx="6" fill="none" stroke="#ffffff" stroke-width="2.25"/>
  <rect x="10" y="10" width="180" height="180" rx="4" fill="none" stroke="#d9d4cf" stroke-width="0.9"/>

  <text x="100" y="33" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="1.6" fill="#ffffff">ArtKey</text>
  <line x1="30" y1="42" x2="170" y2="42" stroke="#d9d4cf" stroke-width="0.9"/>
  <text x="100" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="6.7" letter-spacing="1.15" fill="#bdb5ae">THE ARTFUL EXPERIENCE</text>

  <rect x="45" y="65" width="110" height="110" rx="4" fill="#ffffff" stroke="#353535" stroke-width="1.5"/>
  <rect x="49" y="69" width="102" height="102" rx="2" fill="none" stroke="#e1ddd9" stroke-width="0.8"/>

  <text x="100" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#bdb5ae">Scan to explore</text>
</svg>
